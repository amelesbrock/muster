name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import re, collections
          h = open('site/data/mission-deck.html', encoding='utf-8').read()
          print('LEN', len(h))
          print('CLASSES', collections.Counter(re.findall(r'class="([^"]+)"', h)).most_common(60))
          for name in ['Battlefield Dominance', 'Vital Link', 'Assassination', 'Tipping Point', 'Night Fighting', 'Take and Hold']:
              for m in list(re.finditer(re.escape(name), h))[:3]:
                  print('SNIP', name, '::', h[max(0, m.start()-700):m.start()+900].replace('\n', ' '))
          for sc in re.findall(r'<script[^>]*>(.*?)</script>', h, re.S):
              if 'Dominance' in sc or 'Disposition' in sc or 'generator' in sc.lower():
                  print('SCRIPT', len(sc), sc[:3500].replace('\n', ' '))
          PY
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
