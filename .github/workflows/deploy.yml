name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import csv, collections, re
          csv.field_size_limit(10**9)
          rd = lambda n: list(csv.DictReader(open(f'site/data/{n}.csv', encoding='utf-8-sig'), delimiter='|', quoting=csv.QUOTE_NONE))
          dets = rd('Detachments')
          print('DTYPE', collections.Counter(d['type'] for d in dets).most_common(40))
          for d in dets[:6]: print('DROW', d)
          for d in [x for x in dets if x['faction_id'] in ('LoV', 'GC')]: print('DGL', d['name'], '|', d['type'], '|', d['dp'], '|', d['legend'][:80])
          ab = rd('Detachment_abilities')
          for a in ab:
              t = re.sub('<[^>]+>', ' ', a['description'])
              if re.search(r'cannot include|must include|cannot be included|only include|Detachment tag|tag', t, re.I):
                  print('DREST', a['detachment'], '|', a['name'], '|', t[:260])
          PY
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Compile missions
        run: python3 scripts/missions.py
      - name: Compile weapon abilities
        run: python3 scripts/core_rules.py
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
