name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import csv
          csv.field_size_limit(10**9)
          rows = list(csv.DictReader(open('site/data/Abilities.csv', encoding='utf-8-sig'), delimiter='|', quoting=csv.QUOTE_NONE))
          core = [r for r in rows if not r.get('faction_id')]
          print('ABCOUNT', len(rows), 'core', len(core))
          for r in core: print('AB', r['id'], '|', r['name'], '|', (r.get('description') or '')[:160].replace('\n',' '))
          ws = list(csv.DictReader(open('site/data/Datasheets_wargear.csv', encoding='utf-8-sig'), delimiter='|', quoting=csv.QUOTE_NONE))
          for r in [w for w in ws if 'blast' in (w.get('description') or '').lower()][:3]: print('WG', r['description'][:600])
          PY
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Compile missions
        run: python3 scripts/missions.py
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
