name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly data refresh (03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        run: bash scripts/fetch-data.sh
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
