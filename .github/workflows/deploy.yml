name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Compile missions
        run: python3 scripts/missions.py
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import re, collections
          h = open('site/data/core-rules.html', encoding='utf-8').read()
          heads = re.findall(r'<(h[1-4]|div)([^>]*)>([^<]{2,80})<span class="h_number">([\d.]+)</span>', h)
          print('HEADS', len(heads), collections.Counter((t, re.sub(r'id="[^"]*"', '', a).strip()) for t, a, n, num in heads).most_common(12))
          for t, a, n, num in heads[:80]: print('H', num, t, n.strip())
          for kw in ['ENGAGEMENT RANGE', 'Engagement Range', 'BATTLE-SHOCK', 'Glossary', 'GLOSSARY']:
              ms = list(re.finditer(re.escape(kw), h))
              print('KW', kw, len(ms))
              if ms: print('KSNIP', h[max(0, ms[0].start()-400):ms[0].start()+700].replace('\n', ' '))
          PY
      - name: Compile weapon abilities
        run: python3 scripts/core_rules.py
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
