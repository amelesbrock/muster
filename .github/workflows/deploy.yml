name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import json,glob
          out=[]
          for p in glob.glob('site/data/f/*.json'):
              f=json.load(open(p))
              for u in f['units']:
                  if u.get('cx'): out.append((f['id'],u['n'],u['cx']))
          print('CXCOUNT',len(out))
          for x in out[:25]: print('CX',json.dumps(x)[:400])
          PY
          ls site/data/f
          tar czf /tmp/s.tgz -C site/data index.json core.json f/LoV.json f/GC.json f/TS.json f/CSM.json f/QT.json f/AC.json f/AE.json f/NEC.json 2>/dev/null || tar czf /tmp/s.tgz -C site/data index.json core.json f
          echo "SAMPLE-BEGIN"; base64 -w 0 /tmp/s.tgz; echo; echo "SAMPLE-END"
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
