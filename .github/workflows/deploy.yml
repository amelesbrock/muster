name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Dev sample (temporary)
        run: |
          curl -fsSL -A "Mozilla/5.0 (compatible; MusterApp/1.0)" https://wahapedia.ru/wh40k11ed/the-rules/core-rules/ -o /tmp/core.html || echo CORE-FAIL
          python3 - <<'PY'
          import re
          h = open('/tmp/core.html', encoding='utf-8').read()
          print('CLEN', len(h))
          for name in ['SUSTAINED HITS', 'Sustained Hits', 'BLAST', 'ASSAULT', 'Lethal Hits', 'WEAPON ABILITIES', 'Weapon Abilities']:
              ms = list(re.finditer(re.escape(name), h))
              print('CNT', name, len(ms))
              for m in ms[:2]:
                  print('CSNIP', name, '::', h[max(0, m.start()-500):m.start()+1100].replace('\n', ' '))
          PY
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Compile missions
        run: python3 scripts/missions.py
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
