name: Build and deploy Muster

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 1 * *" # monthly data refresh (1st of the month, 03:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Copy app
        run: mkdir -p site && cp -r app/. site/
      - name: Fetch Wahapedia data export
        timeout-minutes: 15
        run: bash scripts/fetch-data.sh
      - name: Compile data for the app
        run: python3 scripts/compile.py
      - name: Dev sample (temporary)
        run: |
          python3 - <<'PY'
          import re
          h = open('site/data/mission-deck.html', encoding='utf-8').read()
          for m in re.finditer(r"var (\w+)\s*=\s*\[(.*?)\];", h, re.S):
              items = re.findall(r"'((?:[^'\\]|\\.)*)'", m.group(2))
              print('ARR', m.group(1), len(items))
              for it in items[:2]:
                  print('  ITEM', m.group(1), it[:2600])
          for m in list(re.finditer(r'ca7FdOpp', h))[:2]:
              print('FDSNIP', h[max(0, m.start()-1500):m.start()+1500].replace('\n', ' '))
          PY
      - name: Stamp build
        run: |
          STAMP=$(date -u +%Y%m%d%H%M)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'muster-$STAMP'/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
