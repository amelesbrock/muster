<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muster</title>
  <meta name="description" content="Army list builder and battle tracker">
  <meta name="theme-color" content="#121214">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muster">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="view"></div>
  <nav class="tabbar">
    <button data-act="tab" data-tab="lists"><span class="ti">☰</span><span>Lists</span></button>
    <button data-act="tab" data-tab="battle"><span class="ti">⚔</span><span>Battle</span></button>
    <button data-act="tab" data-tab="data"><span class="ti">⛁</span><span>Data</span></button>
  </nav>
  <div id="sheets"></div>
  <div id="busy"><div class="busy-box"><div class="spinner"></div><div class="busy-msg">Working…</div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
